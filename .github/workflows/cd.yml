name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -v tests

  build_windows:
    name: Build Windows executable and create release
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies (incl. PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable (PyInstaller)
        run: |
          pyinstaller --onefile --name SecureDocuments final.py
          mkdir -p dist || true
          if exist dist\SecureDocuments.exe (
            copy dist\SecureDocuments.exe .\SecureDocuments.exe
          )

      - name: Create GitHub release from tag
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: "Automated release for ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip source (exclude secrets)
        run: |
          powershell -Command "Compress-Archive -Path * -DestinationPath release.zip -Force -CompressionLevel Optimal -Exclude '.git/*','users/*','*.db','myenv/*','__pycache__/*'"

      - name: Upload Windows EXE to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./SecureDocuments.exe
          asset_name: SecureDocuments.exe
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release zip
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release.zip
          asset_name: release.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_linux:
    name: Build Linux zip and upload
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Zip source (exclude secrets)
        run: |
          zip -r release-src.zip . -x ".git/*" "users/*" "*.db" "myenv/*" "__pycache__/*"
      - name: Upload source zip to release
        if: always()
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.build_windows.outputs.create_release_upload_url || steps.create_release.outputs.upload_url }}
          asset_path: ./release-src.zip
          asset_name: release-src.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
